<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qsDEM</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/main.css">
<style>
  /* HOMEPAGE ONLY: black page, so the black sky in the render frames meets the page seamlessly.
     Every other page keeps the white default from main.css. */
  :root { --bg: #000000; --ink: #f1efeb; --muted: #9aa0a8; }

  /* Fill the viewport below the header. The frame is 16:9, so on a wide screen one copy is
     taller than the space left over and you see a single full frame. On a portrait phone or
     tablet one copy would occupy a thin band, so the frame REPEATS down the page instead of
     leaving black: background-repeat handles that with one decode per frame, where cloning
     ten <img> per tile would multiply the decoded bitmaps. */
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh; }

  .sweep {
    position: relative;
    flex: 1 0 auto;
    min-height: 56.25vw;            /* 16:9 of the viewport width = one whole frame */
    overflow: hidden;
    background: #000;
  }
  .sweep .layer {
    position: absolute;
    inset: 0;
    background-repeat: repeat-y;    /* the tiling that removes the black space when tall */
    background-size: 100% auto;
    background-position: top center;
    opacity: 0;
    transition: opacity 260ms linear;
    will-change: opacity;
  }
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="index.html">qsDEM</a>
  <nav class="site">
      <a href="apply.html">Apply</a>
      <a href="wiki.html">Wiki</a>
      <a href="about.html">About</a>
  </nav>
</header>

<div class="sweep" id="sweep">
  <div class="layer" id="la"></div>
  <div class="layer" id="lb"></div>
</div>

<script>
'use strict';
// Ten frames evenly spaced across run c8, swept in place as one continuous loop.
// Two layers alternate: the incoming frame fades in ON TOP of the outgoing one, which stays
// opaque underneath. Fading both at once would let the black show through and dip the whole
// image dark at every step.
(function () {
  var BIG = [
    'assets/img/sed04km/00_step00007_3840.webp',
    'assets/img/sed04km/01_step01120_3840.webp',
    'assets/img/sed04km/02_step02226_3840.webp',
    'assets/img/sed04km/03_step03339_3840.webp',
    'assets/img/sed04km/04_step04452_3840.webp',
    'assets/img/sed04km/05_step05558_3840.webp',
    'assets/img/sed04km/06_step06671_3840.webp',
    'assets/img/sed04km/07_step07784_3840.webp',
    'assets/img/sed04km/08_step08890_3840.webp',
    'assets/img/sed04km/09_step10000_3840.webp'
  ];
  var SMALL = [
    'assets/img/sed04km/00_step00007_1920.webp',
    'assets/img/sed04km/01_step01120_1920.webp',
    'assets/img/sed04km/02_step02226_1920.webp',
    'assets/img/sed04km/03_step03339_1920.webp',
    'assets/img/sed04km/04_step04452_1920.webp',
    'assets/img/sed04km/05_step05558_1920.webp',
    'assets/img/sed04km/06_step06671_1920.webp',
    'assets/img/sed04km/07_step07784_1920.webp',
    'assets/img/sed04km/08_step08890_1920.webp',
    'assets/img/sed04km/09_step10000_1920.webp'
  ];
  var HOLD = 620;    // ms each frame is held
  var FADE = 260;    // ms of fade, must match the CSS transition

  // one decode per frame, so pick the variant by device pixels rather than cloning elements
  var wanted = window.innerWidth * (window.devicePixelRatio || 1);
  var FRAMES = wanted > 1920 ? BIG : SMALL;

  var layers = [document.getElementById('la'), document.getElementById('lb')];
  var showing = 0;

  function paint(layer, url) { layer.style.backgroundImage = 'url("' + url + '")'; }

  paint(layers[0], FRAMES[0]);
  layers[0].style.opacity = '1';

  function preload() {
    return Promise.all(FRAMES.map(function (u) {
      return new Promise(function (res) {
        var im = new Image();
        im.onload = im.onerror = res;
        im.src = u;
      });
    }));
  }

  preload().then(function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      paint(layers[0], FRAMES[FRAMES.length - 1]);   // hold the final state instead of animating
      return;
    }
    var i = 0, z = 1;
    setInterval(function () {
      i = (i + 1) % FRAMES.length;
      var incoming = layers[1 - showing];
      var outgoing = layers[showing];
      paint(incoming, FRAMES[i]);
      void incoming.offsetWidth;                     // paint the new frame before fading it in
      incoming.style.zIndex = String(++z);
      incoming.style.opacity = '1';
      setTimeout(function () { outgoing.style.opacity = '0'; }, FADE + 40);
      showing = 1 - showing;
    }, HOLD);
  });
})();
</script>
</body>
</html>

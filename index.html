<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qsDEM</title>
<link rel="stylesheet" href="assets/css/main.css">
<style>
  /* the looping sweep sits in the content column, so it takes the column's width */
  .sweep {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }
  .sweep .layer {
    position: absolute;
    inset: 0;
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 260ms linear;
    will-change: opacity;
  }
  .caption { font-size: 13px; color: #555; margin-top: 8px; }
</style>
</head>
<body>

<nav>
  <a href="index.html" aria-current="page">Home</a> <span class="sep">&middot;</span>
  <a href="apply.html">Apply</a> <span class="sep">&middot;</span>
  <a href="wiki.html">Wiki</a> <span class="sep">&middot;</span>
  <a href="about.html">About</a>
</nav>
<div class="columns">
  <div class="sidebar">
    <h1>qsDEM</h1>
    <p>A quasi-static discrete element model for slow geological deformation.</p>
    <div class="contact">
      Developed and maintained by
      <a href="https://eps.harvard.edu/research-group/meade-group/">Meade Group</a> at Harvard.
    </div>
  </div>

  <div class="main">
    <div class="sweep" id="sweep">
      <div class="layer" id="la"></div>
      <div class="layer" id="lb"></div>
    </div>
  </div>
</div>

<script>
'use strict';
// Ten frames evenly spaced across the sediment run, swept in place as one continuous loop.
// Two layers alternate: the incoming frame fades in ON TOP of the outgoing one, which stays
// opaque underneath. Fading both at once would let the black show through and dip the whole
// image dark at every step.
(function () {
  var BIG = [
    'assets/img/sed04km/00_step00007_3840.webp',
    'assets/img/sed04km/01_step01120_3840.webp',
    'assets/img/sed04km/02_step02226_3840.webp',
    'assets/img/sed04km/03_step03339_3840.webp',
    'assets/img/sed04km/04_step04452_3840.webp',
    'assets/img/sed04km/05_step05558_3840.webp',
    'assets/img/sed04km/06_step06671_3840.webp',
    'assets/img/sed04km/07_step07784_3840.webp',
    'assets/img/sed04km/08_step08890_3840.webp',
    'assets/img/sed04km/09_step10000_3840.webp'
  ];
  var SMALL = [
    'assets/img/sed04km/00_step00007_1920.webp',
    'assets/img/sed04km/01_step01120_1920.webp',
    'assets/img/sed04km/02_step02226_1920.webp',
    'assets/img/sed04km/03_step03339_1920.webp',
    'assets/img/sed04km/04_step04452_1920.webp',
    'assets/img/sed04km/05_step05558_1920.webp',
    'assets/img/sed04km/06_step06671_1920.webp',
    'assets/img/sed04km/07_step07784_1920.webp',
    'assets/img/sed04km/08_step08890_1920.webp',
    'assets/img/sed04km/09_step10000_1920.webp'
  ];
  var HOLD = 620;    // ms each frame is held
  var FADE = 260;    // ms of fade, must match the CSS transition

  var el = document.getElementById('sweep');
  var wanted = el.getBoundingClientRect().width * (window.devicePixelRatio || 1);
  var FRAMES = wanted > 1920 ? BIG : SMALL;

  var layers = [document.getElementById('la'), document.getElementById('lb')];
  var showing = 0;

  function paint(layer, url) { layer.style.backgroundImage = 'url("' + url + '")'; }

  paint(layers[0], FRAMES[0]);
  layers[0].style.opacity = '1';

  function preload() {
    return Promise.all(FRAMES.map(function (u) {
      return new Promise(function (res) {
        var im = new Image();
        im.onload = im.onerror = res;
        im.src = u;
      });
    }));
  }

  preload().then(function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      paint(layers[0], FRAMES[FRAMES.length - 1]);   // hold the final state instead of animating
      return;
    }
    var i = 0, z = 1;
    setInterval(function () {
      i = (i + 1) % FRAMES.length;
      var incoming = layers[1 - showing];
      var outgoing = layers[showing];
      paint(incoming, FRAMES[i]);
      void incoming.offsetWidth;                     // paint the new frame before fading it in
      incoming.style.zIndex = String(++z);
      incoming.style.opacity = '1';
      setTimeout(function () { outgoing.style.opacity = '0'; }, FADE + 40);
      showing = 1 - showing;
    }, HOLD);
  });
})();
</script>
</body>
</html>

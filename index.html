<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qsDEM</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="assets/css/main.css">
<style>
  /* HOMEPAGE ONLY: no sidebar, black page, animation over the whole page. Every other page keeps
     the 960px column and the left sidebar from main.css. */
  html, body { background: #000; }
  body {
    max-width: none;
    padding: var(--nav-h) 0 0;     /* room for the fixed nav */
    color: #eee;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100svh;
  }
  nav {
    background: #000;              /* fixed positioning comes from main.css */
    padding: 30px 40px 20px;
  }
  nav a { color: #fff; }                       /* all white on black, easier to read than the blue */
  nav a[aria-current="page"] { color: #fff; }
  nav .sep { color: #777; }

  /* Fills the page under the nav. One 16:9 copy is taller than that on a wide screen, so a
     desktop sees a whole frame; on a portrait phone the frame REPEATS down the page instead of
     leaving black, via background-repeat, which keeps one decoded bitmap per frame. */
  .sweep {
    position: relative;
    flex: 1 0 auto;
    min-height: 56.25vw;
    overflow: hidden;
    background: #000;
  }
  .sweep .layer {
    position: absolute;
    inset: 0;
    /* repeat vs cover is set by script from the container's shape, see fit() */
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 260ms linear;
    will-change: opacity;
  }
  @media (max-width: 700px) { nav { padding: 20px 20px; } }
</style>
</head>
<body>

<nav>
  <a href="index.html" aria-current="page">qsDEM</a> <span class="sep">&middot;</span>
  <a href="apply.html">Apply</a> <span class="sep">&middot;</span>
  <a href="wiki.html">Wiki</a> <span class="sep">&middot;</span>
  <a href="about.html">About</a>
</nav>

<div class="sweep" id="sweep">
  <div class="layer" id="la"></div>
  <div class="layer" id="lb"></div>
</div>

<script>
'use strict';
// Ten frames evenly spaced across the sediment run, swept in place as one continuous loop.
// Two layers alternate: the incoming frame fades in ON TOP of the outgoing one, which stays
// opaque underneath. Fading both at once would let the black show through and dip the whole
// image dark at every step.
(function () {
  var BIG = [
    'assets/img/sed06km/00_step00007_3840.webp',
    'assets/img/sed06km/01_step01120_3840.webp',
    'assets/img/sed06km/02_step02226_3840.webp',
    'assets/img/sed06km/03_step03339_3840.webp',
    'assets/img/sed06km/04_step04452_3840.webp',
    'assets/img/sed06km/05_step05558_3840.webp',
    'assets/img/sed06km/06_step06671_3840.webp',
    'assets/img/sed06km/07_step07784_3840.webp',
    'assets/img/sed06km/08_step08890_3840.webp',
    'assets/img/sed06km/09_step10000_3840.webp'
  ];
  var SMALL = [
    'assets/img/sed06km/00_step00007_1920.webp',
    'assets/img/sed06km/01_step01120_1920.webp',
    'assets/img/sed06km/02_step02226_1920.webp',
    'assets/img/sed06km/03_step03339_1920.webp',
    'assets/img/sed06km/04_step04452_1920.webp',
    'assets/img/sed06km/05_step05558_1920.webp',
    'assets/img/sed06km/06_step06671_1920.webp',
    'assets/img/sed06km/07_step07784_1920.webp',
    'assets/img/sed06km/08_step08890_1920.webp',
    'assets/img/sed06km/09_step10000_1920.webp'
  ];
  var HOLD = 620;    // ms each frame is held
  var FADE = 260;    // ms of fade, must match the CSS transition

  var wanted = window.innerWidth * (window.devicePixelRatio || 1);
  var FRAMES = wanted > 1920 ? BIG : SMALL;

  var layers = [document.getElementById('la'), document.getElementById('lb')];
  var showing = 0;

  function paint(layer, url) { layer.style.backgroundImage = 'url("' + url + '")'; }

  // A landscape window needs barely more than one frame, and tiling there leaves a thin sliver of
  // the next frame whose black sky meets this frame's red mantle bottom, a faint red line. So tile
  // only when the container is genuinely taller than about one and a half frames, which is the
  // portrait case the repetition was added for.
  var sweepEl = document.getElementById('sweep');
  function fit() {
    var r = sweepEl.getBoundingClientRect();
    var tiles = r.width ? r.height / (r.width * 9 / 16) : 1;
    var tiled = tiles > 1.5;
    layers.forEach(function (l) {
      l.style.backgroundRepeat = tiled ? 'repeat-y' : 'no-repeat';
      l.style.backgroundSize = tiled ? '100% auto' : 'cover';
      l.style.backgroundPosition = tiled ? 'top center' : 'center';
    });
  }

  paint(layers[0], FRAMES[0]);
  layers[0].style.opacity = '1';
  fit();
  window.addEventListener('resize', fit);

  function preload() {
    return Promise.all(FRAMES.map(function (u) {
      return new Promise(function (res) {
        var im = new Image();
        im.onload = im.onerror = res;
        im.src = u;
      });
    }));
  }

  preload().then(function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      paint(layers[0], FRAMES[FRAMES.length - 1]);   // hold the final state instead of animating
      return;
    }
    var i = 0, z = 1;
    setInterval(function () {
      i = (i + 1) % FRAMES.length;
      var incoming = layers[1 - showing];
      var outgoing = layers[showing];
      paint(incoming, FRAMES[i]);
      void incoming.offsetWidth;                     // paint the new frame before fading it in
      incoming.style.zIndex = String(++z);
      incoming.style.opacity = '1';
      setTimeout(function () { outgoing.style.opacity = '0'; }, FADE + 40);
      showing = 1 - showing;
    }, HOLD);
  });
})();
</script>
</body>
</html>

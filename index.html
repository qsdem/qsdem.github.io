<style>
  /* HOMEPAGE ONLY: black page, so the black sky in the render frames meets the page seamlessly.
     Every other page keeps the white default from main.css. */
  :root { --bg: #000000; --ink: #f1efeb; --muted: #9aa0a8; }

  /* full bleed: the deliberate exception to --page-max */
  .sweep {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
  }
  .sweep img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 260ms linear;
  }
  .sweep img.on { opacity: 1; }
</style>

<script>
'use strict';
// Ten frames evenly spaced across the run, crossfaded in place as one looping sweep.
// Frame 0 ships in the HTML; the other nine are attached after first paint so the page is
// never blocked on ~35 MB of imagery, and the loop only starts once they have all decoded.
(function () {
  var el = document.getElementById('sweep');
  var imgs = Array.prototype.slice.call(el.querySelectorAll('img'));
  var HOLD = 620;          // ms each frame is held
  var FADE = 260;          // ms of fade, must match the CSS transition below

  function attach() {
    return Promise.all(imgs.map(function (im) {
      if (im.dataset.src) {
        im.srcset = im.dataset.srcset;
        im.src = im.dataset.src;
        delete im.dataset.src;
        delete im.dataset.srcset;
      }
      if (im.complete) return Promise.resolve();
      return new Promise(function (res) {
        im.addEventListener('load', res, {once: true});
        im.addEventListener('error', res, {once: true});
      });
    }));
  }

  function loop() {
    var i = 0, z = 1;
    setInterval(function () {
      var prev = i;
      var next = (i + 1) % imgs.length;
      // Fade the incoming frame in ON TOP of the outgoing one, which stays fully opaque
      // underneath. Fading both at once would let the black container show through mid-way
      // and dip the whole image dark at every transition.
      imgs[next].style.zIndex = String(++z);
      imgs[next].classList.add('on');
      setTimeout(function () { imgs[prev].classList.remove('on'); }, FADE + 40);
      i = next;
    }, HOLD);
  }

  attach().then(function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      imgs[0].classList.remove('on');           // hold the final state instead of animating
      imgs[imgs.length - 1].classList.add('on');
      return;
    }
    loop();
  });
})();
</script>
